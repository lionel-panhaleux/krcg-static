name: Deployment
on:
  workflow_dispatch:
  # Deploy committed assets (card images, web files) on push; the data cron
  # keeps data/ fresh every 6h independently.
  push:
    branches: [main]
  schedule:
    # Weekly safety net (Mondays 01:00 UTC)
    - cron: "0 1 * * 1"

jobs:
  deployment:
    runs-on: ubuntu-latest
    # DEPLOY_SSH_KEY is a secret; DEPLOY_HOST and DEPLOY_HOST_KEY are variables
    # (pushed by server-setup's `just sync`)
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Build static files
        run: uv run krcg-static build
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts
      - name: Deploy files
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: rsync -rlptq --delete-after -e "ssh -i $HOME/.ssh/deploy" build/ "deploy@$DEPLOY_HOST:/var/www/static/"
