name: Deployment
on:
  workflow_dispatch:
  # Deploy committed assets (card images, web files) on push; the data cron
  # keeps data/ fresh every 6h independently.
  push:
    branches: [main]
  schedule:
    # Weekly safety net (Mondays 01:00 UTC)
    - cron: "0 1 * * 1"

jobs:
  deployment:
    runs-on: ubuntu-latest
    environment: krcg.org
    steps:
      - uses: actions/checkout@v6
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Build static files
        run: uv run krcg-static build
      - name: Setup SSH key
        run: |
          mkdir /home/runner/.ssh
          echo "${{ secrets.KRCG_DEPLOY_KEY }}" > /home/runner/.ssh/id_rsa
          chmod 600 /home/runner/.ssh/id_rsa
          echo "${{ secrets.KRCG_GRA_HOST_ID }}" > /home/runner/.ssh/known_hosts
          echo "${{ secrets.KRCG_SBG_HOST_ID }}" >> /home/runner/.ssh/known_hosts
      - name: Deploy files to krcg-sbg
        run: rsync -rlptq --delete-after -e ssh build/ lpanhaleux@51.178.45.139:projects/static.krcg.org/dist
