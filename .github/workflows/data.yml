name: Data
on:
  workflow_dispatch:
  # Fired by rulings-website when a proposal is approved, so approved rulings
  # reach players immediately instead of waiting for the 6h cron.
  repository_dispatch:
    types: [rulings-updated]
  schedule:
    # Refresh the data files every 6 hours
    - cron: "0 */6 * * *"

jobs:
  data:
    runs-on: ubuntu-latest
    # DEPLOY_SSH_KEY is a secret; DEPLOY_HOST and DEPLOY_HOST_KEY are variables
    # (pushed by server-setup's `just sync`)
    environment: production
    steps:
      - uses: actions/checkout@v6
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Build data files
        run: uv run krcg-static build --data
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts
      - name: Deploy data files
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: rsync -rlptq --delete-after -e "ssh -i $HOME/.ssh/deploy" build/data/ "deploy@$DEPLOY_HOST:/var/www/static/data/"
